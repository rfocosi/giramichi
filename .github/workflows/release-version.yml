name: Update Version on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0 or 0.1.0)'
        required: true
        type: string

jobs:
  update-version:
    name: Sync Version to Main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract and normalize version
        id: extract_version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          echo "Raw tag: $TAG"
          # Remove leading 'v' or 'V' if present
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "Normalized version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Error: Version is empty!"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update package version
        run: |
          npm version "${{ steps.extract_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit and push version update to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet package.json package-lock.json; then
            echo "Version is already up-to-date. No changes to commit."
          else
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
            git push origin main
          fi
