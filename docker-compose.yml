services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: giramichi-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/giramichi-realm.json:/opt/keycloak/data/import/giramichi-realm.json
    restart: unless-stopped

  giramichi-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: giramichi-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GIRAMICHI_API_URL=${GIRAMICHI_API_URL:-}
      - VITE_DEMO=${VITE_DEMO:-false}
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  giramichi-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: giramichi-frontend
    environment:
      - GIRAMICHI_API_URL=${GIRAMICHI_API_URL:-}
      - VITE_DEMO=${VITE_DEMO:-false}
    ports:
      - "3000:80"
    depends_on:
      - giramichi-server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: giramichi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  giramichi-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: giramichi-mcp
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3002
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
    depends_on:
      - giramichi-server
      - redis
    restart: unless-stopped

